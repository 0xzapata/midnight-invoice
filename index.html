<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight Invoice - Offline Invoice Generator</title>
    <meta name="description" content="Generate beautiful, professional invoices offline in seconds. Free invoice generator with PDF export and local storage." />
    <meta name="author" content="Invoice Generator" />
    <meta property="og:title" content="Invoice Generator | Create Professional Invoices" />
    <meta property="og:description" content="Generate beautiful, professional invoices in seconds. Free invoice generator with PDF export." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the first paint, on every route (dark by
      // default). next-themes (src/components/AppThemeProvider.tsx) takes over after load.
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
