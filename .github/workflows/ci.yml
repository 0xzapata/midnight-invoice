name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vite, Vitest, jsdom and react-router run on Node (>= 22.22).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Worker types are up to date
        run: bunx wrangler types --strict-vars=false --check

      - name: Typecheck
        run: bun run typecheck

      # web (jsdom), server (Hono + local D1 in workerd) and workerd
      # (production build running in workerd) Vitest projects.
      - name: Test
        run: bun run test:run

      - name: Build
        run: bun run build

      # Validates the deployable bundle (bindings, size) without credentials.
      # Deploying is a separate, opt-in workflow: deploy.yml (README "Continuous deployment").
      - name: Deploy dry run
        run: bunx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
